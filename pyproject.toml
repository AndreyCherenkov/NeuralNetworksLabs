[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-course"
version = "0.1.0"
description = "ЛР0: инфраструктура воспроизводимых экспериментов (Experiment Harness)"
readme = "README.md"
# Раздел 10: Python не ниже 3.11, PyTorch 2.x.
requires-python = ">=3.11,<3.14"
# Здесь — диапазоны совместимых версий. Точные версии всего дерева
# фиксируются в requirements.lock и conda-explicit.txt, их hash
# записывается в manifest каждого запуска.
# torch/torchvision ставятся из индекса https://download.pytorch.org/whl/cu128;
# CUDA-сборка работает и на CPU, устройство выбирается полем device в конфиге.
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    "pydantic>=2.5,<3",       # схема и валидация resolved config
    "matplotlib>=3.8,<4",     # plots/ и графики для отчёта (E2, E4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
]
# Внешние логгеры допустимы (раздел 18), но локальный metrics.jsonl обязателен.
tracking = [
    "tensorboard>=2.15,<3",
]

# Обязательный интерфейс запуска — `python -m src.<module>` (раздел 7),
# поэтому импортируемый пакет называется именно `src`.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: тесты с реальным обучением на нескольких шагах",
    "cuda: требуют CUDA, пропускаются на CPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Целевое окружение (раздел 10): с чем эксперименты ДОЛЖНЫ запускаться.
# Записывается в manifest как declared и сверяется с фактическим окружением.
# cuda — версия CUDA, с которой собран torch ("none" для CPU-сборки),
# а не устройство конкретного запуска.
[tool.harness.target]
python = "3.12"
torch  = "2.14.1"
cuda   = "12.8"